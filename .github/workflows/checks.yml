name: Repository checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter the suite is actually proven on locally.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Install the exact, hash-pinned set (#198): local, CI, the image and the
      # devcontainer all run the same versions, so R07-style skew cannot recur.
      - run: pip install --require-hashes -r requirements.lock
        working-directory: backend
      # The lock must still satisfy requirements.txt. uv keeps the existing pins
      # as preferences, so this only differs when the ranges and the lock drift.
      - name: Lock matches requirements.txt
        working-directory: backend
        run: |
          pip install uv==0.13.0
          cp requirements.lock "$RUNNER_TEMP/check.lock"
          uv pip compile requirements.txt --universal --python-version 3.13             --generate-hashes --no-header --no-annotate -q -o "$RUNNER_TEMP/check.lock"
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' "$RUNNER_TEMP/check.lock")             || { echo "::error::requirements.lock is stale; regenerate it (see its header)"; exit 1; }
      - run: python -m pytest tests -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --maxWorkers=2
      - run: npm run build
