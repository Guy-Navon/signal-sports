# Signal Sports web server (#263). Same origin for the SPA and the API.
# Upstream "api" is the Compose service name; it is never published itself.

# Behind Tailscale Serve the TLS hop ends before nginx; keep an upstream
# X-Forwarded-Proto when one is sent, otherwise report our own scheme.
map $http_x_forwarded_proto $signal_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # nginx itself (container healthcheck); never reaches the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Host, Origin and Sec-Fetch-* reach the API unchanged: the CSRF middleware
    # compares Origin with CSRF_ALLOWED_ORIGINS (the public https origin).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $signal_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed file names under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (/login, /signup, /results, ...) serve
    # index.html, which must never be cached across deploys.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
