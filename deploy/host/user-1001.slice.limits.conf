# Signal Sports — TOPOLOGY A ONLY (one VM for prod and dev; HOSTING_PLAN §9.2).
# TEMPLATE for /etc/systemd/system/user-1001.slice.d/limits.conf, where 1001 is
# the `dev` user's uid. Everything dev starts (SSH sessions, VS Code Server,
# Claude Code, tmux, `systemd-run --user`) lands in this slice [A: confirm once
# with `systemd-cgls`]. Prod containers run under system.slice, outside it.
# Not applied anywhere; tune after measuring. Then: systemctl daemon-reload.
[Slice]
MemoryHigh=4G
MemoryMax=5G
MemorySwapMax=1G
CPUQuota=300%
TasksMax=4096
IOWeight=50
